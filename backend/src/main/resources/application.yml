server:
  port: 8080

spring:
  application:
    name: jobmatch-ai-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 12MB

# Proveedor de IA. mode=stub genera un análisis de ejemplo sin llamar a ninguna API
# (útil en desarrollo). mode=groq usa la API de Groq (compatible con OpenAI).
ai:
  mode: ${AI_MODE:stub}
  base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
  api-key: ${GROQ_API_KEY:}
  model: ${AI_MODEL:llama-3.3-70b-versatile}
  temperature: 0.2

app:
  security:
    # API key compartida que exige el backend en la cabecera X-Api-Key.
    # Si se deja vacía, la autenticación se desactiva (solo para desarrollo local).
    api-key: ${APP_API_KEY:}
    # Orígenes permitidos por CORS (coma-separados). Vacío => se permite cualquiera (dev).
    allowed-origins: ${APP_ALLOWED_ORIGINS:}
    rate-limit:
      requests: 60
      window-seconds: 60

logging:
  level:
    com.jobmatch.ai: INFO
